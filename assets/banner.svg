<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #f8fafc; }
      
      /* SVG SMIL / CSS Animations for Dynamic Aspect */
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float-reverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse-line {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glow-pulse {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
      }

      .floating-card-1 { animation: float 6s ease-in-out infinite; transform-origin: 940px 165px; }
      .floating-card-2 { animation: float-reverse 7s ease-in-out infinite; transform-origin: 790px 225px; }
      .pulse-bg { animation: glow-pulse 4s ease-in-out infinite; }
      .flow-path {
        stroke-dasharray: 20, 10;
        animation: pulse-line 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-gradient)" rx="16"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" class="pulse-bg" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="250" r="200" fill="#a855f7" class="pulse-bg" opacity="0.2" filter="url(#glow)"/>

  <!-- Grid Lines -->
  <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 150,0 L 150,350 M 300,0 L 300,350 M 450,0 L 450,350 M 600,0 L 600,350 M 750,0 L 750,350 M 900,0 L 900,350 M 1050,0 L 1050,350" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Animated Payment Flow Stream -->
  <path d="M 80 260 Q 350 310 650 240 T 1120 120" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.6" class="flow-path"/>

  <!-- Decorative Payment Cards (Right side) -->
  <g class="floating-card-1">
    <!-- Credit Card Glassmorphism Mockup -->
    <rect x="780" y="70" width="320" height="190" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="810" y="105" width="45" height="35" rx="6" fill="#fbbf24" opacity="0.85"/> <!-- Chip -->
    <circle cx="1040" cy="210" r="18" fill="#eb001b" opacity="0.8"/>
    <circle cx="1065" cy="210" r="18" fill="#f79e1b" opacity="0.8"/>
    <text x="810" y="180" font-family="monospace" font-size="18" fill="#e2e8f0" letter-spacing="3">•••• 8842</text>
    <text x="810" y="220" font-family="sans-serif" font-size="12" fill="#94a3b8">GLOBAL PAYMENT RAIL</text>
  </g>

  <g class="floating-card-2">
    <!-- Small Badge floating behind -->
    <rect x="710" y="180" width="160" height="90" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" opacity="0.95"/>
    <text x="730" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">✓ 100+ Gateways</text>
    <text x="730" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">Orchestration &amp; POS</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="52" width="280" height="34" rx="17" fill="url(#accent-grad)" opacity="0.2"/>
    <rect x="1" y="53" width="278" height="32" rx="16" fill="#0f172a" opacity="0.8"/>
    <text x="16" y="74" class="badge-text">💳 AWESOME PAYMENTS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="142" class="title">Awesome Payments</text>

    <!-- Gradient Text Highlight Underline -->
    <rect x="0" y="156" width="460" height="5" rx="2.5" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Platforms, Payment Gateways</text>
    <text x="0" y="230" class="subtitle">&amp; Open-Source Fintech Infrastructure</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 262)">
      <rect x="0" y="0" width="120" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Gateways</text>

      <rect x="132" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="146" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a855f7">🌐 Orchestration</text>

      <rect x="284" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="298" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#4ade80">🔓 Open-Source</text>
    </g>
  </g>
</svg>
