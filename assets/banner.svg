<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity=".03"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes float-reverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulse-line{0%{stroke-dashoffset:1000}}@keyframes glow-pulse{0%{opacity:.4}50%{opacity:.8}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:54px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:15px;fill:#f8fafc}.floating-card-1{animation:float 6s ease-in-out infinite;transform-origin:940px 165px}.floating-card-2{animation:float-reverse 7s ease-in-out infinite;transform-origin:790px 225px}.pulse-bg{animation:glow-pulse 4s ease-in-out infinite}.flow-path{stroke-dasharray:20,10;animation:pulse-line 25s linear infinite}</style></defs><rect width="1200" height="350" fill="url(#bg-gradient)" rx="16"/><circle cx="200" cy="100" r="180" fill="#6366f1" class="pulse-bg" filter="url(#glow)" opacity=".25"/><circle cx="1000" cy="250" r="200" f